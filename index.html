<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Pattern Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#4f46e5;--ok:#16a34a;--st:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e6e8eb;--mu:#8b93a1;--bd:#262c36;--ac:#818cf8;--ok:#22c55e;--st:#fbbf24}}
:root[data-t=light]{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#4f46e5;--ok:#16a34a;--st:#f59e0b}
:root[data-t=dark]{--bg:#0e1116;--card:#171b22;--tx:#e6e8eb;--mu:#8b93a1;--bd:#262c36;--ac:#818cf8;--ok:#22c55e;--st:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.stats b{font-size:20px;display:block}
.stats span{color:var(--mu);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:160px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
.tools select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px}
.pat{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.ph .n{color:var(--mu);width:22px;font-size:13px}
.ph .t{flex:1;font-weight:600}
.ph .c{color:var(--mu);font-size:13px;white-space:nowrap}
.ph .bar{width:70px}
.ph .ch{transition:transform .2s;color:var(--mu)}
.pat.open .ch{transform:rotate(90deg)}
.pb{display:none;border-top:1px solid var(--bd);padding:6px 10px 10px}
.pat.open .pb{display:block}
.p{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--bd)}
.p:last-child{border:0}
.p input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.p a{color:var(--ac);text-decoration:none;font-weight:600;min-width:52px}
.p a:hover{text-decoration:underline}
.p.done a{color:var(--mu);text-decoration:line-through}
.p .nt{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid transparent;padding:3px 4px;font-size:13px}
.p .nt:focus{outline:0;border-color:var(--ac)}
.s{background:none;border:0;font-size:18px;padding:0 4px;color:var(--mu)}
.s.on{color:var(--st)}
.hide{display:none!important}
.f{margin-top:24px;color:var(--mu);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>DSA Pattern Tracker</h1><div class="sub">30 patterns · tick done, ★ to revisit, add notes. Saved in your browser.</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="th">Theme</button><button id="ex">Export</button><button id="im">Import</button><button id="rs">Reset</button>
      <input type="file" id="fi" accept=".json" class="hide">
    </div>
  </div>

  <div class="sum">
    <div class="stats">
      <div><b id="sd">0</b><span>Solved</span></div>
      <div><b id="st">0</b><span>Total</span></div>
      <div><b id="sp">0%</b><span>Complete</span></div>
      <div><b id="sr">0</b><span>To revisit</span></div>
      <div><b id="sk">0</b><span>Day streak</span></div>
    </div>
    <div class="bar"><i id="gb"></i></div>
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="Search pattern or problem #...">
    <select id="fl">
      <option value="all">All</option>
      <option value="todo">Not solved</option>
      <option value="done">Solved</option>
      <option value="rev">★ Revisit</option>
    </select>
    <button id="ea">Expand all</button><button id="ca">Collapse all</button>
  </div>

  <div id="list"></div>
  <div class="f">Problem numbers link to a LeetCode search. Fork &amp; deploy on GitHub Pages.</div>
</div>

<script>
const DATA=[
["Sliding Window",[3,76,209,424,567,904]],
["Two Pointers",[11,15,16,18,42,167]],
["Fast/Slow Pointers (Linked List)",[141,142,19,876,160,234]],
["Binary Search on Sorted Data",[33,34,35,153,162,704]],
["Binary Search on Answer",[875,1011,410,774,1283,1482]],
["Hashing / Frequency Maps",[1,49,128,217,242,347]],
["Prefix Sum / Running Sum",[303,560,724,930,974,523]],
["Difference Array / Range Updates",[370,1094,1109,1893,1943,2381]],
["Monotonic Stack",[739,496,503,84,85,901]],
["Monotonic Queue / Deque",[239,862,1425,1438,1499,1696]],
["Heap / Top K",[215,347,692,703,973,1046]],
["Intervals",[56,57,252,253,435,452]],
["Greedy Scheduling / Sorting",[45,55,406,621,763,134]],
["Linked List Manipulation",[21,23,24,25,92,138]],
["Tree DFS",[104,112,113,543,124,226]],
["Tree BFS / Level Order",[102,103,199,515,637,116]],
["BST Problems",[98,99,230,235,450,700]],
["Backtracking Basics",[46,47,77,78,90,39]],
["Backtracking with Constraints",[40,17,79,131,51,52]],
["Graph BFS / DFS",[200,695,733,994,1091,1254]],
["Topological Sort / DAG",[207,210,802,1462,1203,2115]],
["Union Find / DSU",[547,684,1319,1579,990,1202]],
["Shortest Path",[743,787,1514,1631,1334,1976]],
["MST / Graph Greedy",[1584,1135,1168,1489,778,1102]],
["Trie",[208,211,212,648,677,1268]],
["Bit Manipulation",[136,137,191,338,268,190]],
["1D DP Basics",[70,198,213,322,279,300]],
["Knapsack / Subset DP",[416,494,518,474,1049,879]],
["Grid DP",[62,63,64,221,931,120]],
["String DP / Sequence DP",[1143,72,115,583,97,1312]]
];
const KEY="dsa-tracker-v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.d=S.d||{};S.r=S.r||{};S.n=S.n||{};S.o=S.o||{};S.days=S.days||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const list=$("list");

function build(){
  list.innerHTML="";
  DATA.forEach(([name,ps],i)=>{
    const d=document.createElement("div");
    d.className="pat"+(S.o[i]?" open":"");
    d.dataset.i=i;
    d.innerHTML=`<div class="ph"><span class="n">${i+1}</span><span class="t">${name}</span><span class="c"></span><div class="bar"><i></i></div><span class="ch">▶</span></div><div class="pb"></div>`;
    const pb=d.querySelector(".pb");
    ps.forEach(n=>{
      const k=n;
      const r=document.createElement("div");
      r.className="p";r.dataset.n=n;
      r.innerHTML=`<input type="checkbox"><a target="_blank" rel="noopener" href="https://leetcode.com/problemset/?search=${n}">#${n}</a><input class="nt" placeholder="note..."><button class="s" title="Revisit">★</button>`;
      const cb=r.querySelector("input[type=checkbox]"),nt=r.querySelector(".nt"),st=r.querySelector(".s");
      cb.checked=!!S.d[k];nt.value=S.n[k]||"";st.classList.toggle("on",!!S.r[k]);
      cb.onchange=()=>{
        if(cb.checked){S.d[k]=1;const t=new Date().toISOString().slice(0,10);if(!S.days.includes(t))S.days.push(t)}else delete S.d[k];
        save();update()};
      nt.oninput=()=>{S.n[k]=nt.value;save()};
      st.onclick=()=>{S.r[k]=!S.r[k];if(!S.r[k])delete S.r[k];st.classList.toggle("on",!!S.r[k]);save();update()};
      pb.appendChild(r);
    });
    d.querySelector(".ph").onclick=()=>{d.classList.toggle("open");S.o[i]=d.classList.contains("open");save()};
    list.appendChild(d);
  });
  update();
}

function streak(){
  const set=new Set(S.days);let c=0;const d=new Date();
  if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){c++;d.setDate(d.getDate()-1)}
  return c;
}

function update(){
  let tot=0,dn=0,rv=0;
  document.querySelectorAll(".pat").forEach(p=>{
    const rows=p.querySelectorAll(".p");let t=rows.length,d=0;
    rows.forEach(r=>{const n=r.dataset.n;const x=!!S.d[n];r.classList.toggle("done",x);if(x)d++;if(S.r[n])rv++});
    tot+=t;dn+=d;
    p.querySelector(".c").textContent=d+"/"+t;
    p.querySelector(".bar>i").style.width=(d/t*100)+"%";
  });
  $("sd").textContent=dn;$("st").textContent=tot;
  $("sp").textContent=Math.round(dn/tot*100)+"%";
  $("sr").textContent=rv;$("sk").textContent=streak();
  $("gb").style.width=(dn/tot*100)+"%";
  filter();
}

function filter(){
  const q=$("q").value.trim().toLowerCase(),f=$("fl").value;
  document.querySelectorAll(".pat").forEach(p=>{
    const name=p.querySelector(".t").textContent.toLowerCase();
    const nameHit=q&&name.includes(q);
    let any=false;
    p.querySelectorAll(".p").forEach(r=>{
      const n=r.dataset.n;
      let show=true;
      if(q&&!nameHit&&!n.includes(q.replace("#","")))show=false;
      if(f==="todo"&&S.d[n])show=false;
      if(f==="done"&&!S.d[n])show=false;
      if(f==="rev"&&!S.r[n])show=false;
      r.classList.toggle("hide",!show);
      if(show)any=true;
    });
    p.classList.toggle("hide",!any);
    if(any&&(q||f!=="all"))p.classList.add("open");
  });
}

$("q").oninput=filter;$("fl").onchange=filter;
$("ea").onclick=()=>document.querySelectorAll(".pat").forEach(p=>p.classList.add("open"));
$("ca").onclick=()=>document.querySelectorAll(".pat").forEach(p=>p.classList.remove("open"));
$("th").onclick=()=>{
  const r=document.documentElement,dark=matchMedia("(prefers-color-scheme:dark)").matches;
  const cur=r.dataset.t||(dark?"dark":"light");
  r.dataset.t=cur==="dark"?"light":"dark";
  try{localStorage.setItem(KEY+"-t",r.dataset.t)}catch(e){}
};
try{const t=localStorage.getItem(KEY+"-t");if(t)document.documentElement.dataset.t=t}catch(e){}
$("ex").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download="dsa-progress.json";a.click();
};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);S=Object.assign({d:{},r:{},n:{},o:{},days:[]},j);save();build()}catch(x){alert("Invalid file")}};
  rd.readAsText(f);
};
$("rs").onclick=()=>{if(confirm("Reset all progress?")){S={d:{},r:{},n:{},o:{},days:[]};save();build()}};
build();
</script>
</body>
</html>
